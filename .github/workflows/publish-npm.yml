# 把包发到 npm
#
# 入口两个：
#   1. 推 v* 标签时自动跑（与 release.yml 同一个标签各自触发一次，互不依赖）
#   2. 手动触发（Actions 页面或 gh workflow run publish-npm.yml）：dry-run 默认 true，只演练
#
# 为什么是「自己盯标签」而不是被 release.yml 调用（走过一次弯路，记在这里）：
# npm 的 Trusted Publisher 认的是**触发这次运行的入口工作流**，而不是真正执行发布的那一个。
# 实测：release.yml 里用 `uses: ./.github/workflows/publish-npm.yml` 调用时，
# `npm publish` 拿到 OIDC 后 registry 回 E404（provenance 都签名上传了，鉴权就是不通过）；
# 直接跑 publish-npm.yml（手动或推标签）则成功——1.0.1、1.0.2 就是这么发出去的。
# 所以要么让 npm 侧把工作流文件名改成 release.yml，要么让这个工作流自己盯标签；这里选后者，
# npm 侧不必改配置（配置里填的是 publish-npm.yml，与手动演练路径也一致）。
#
# 授权方式：
#   Trusted Publishing（当前用的）：npmjs.com -> 你的包 -> Settings -> Trusted Publisher ->
#   GitHub Actions，填仓库 EtherosGroup/EhBrowser 与工作流文件名 publish-npm.yml。
#   靠 OIDC 临时凭证发布，自动带上 provenance 签名，不需要长期 token。
#   （另一条路是传统 Token：仓库密钥 NPM_TOKEN + 放开下面 NODE_AUTH_TOKEN 那行。）
#
# 演练：手动触发时将 dry-run 保持 true，只查看打包结果，不实际发布。

name: publish-npm

on:
    push:
        tags: ["v*"]
    workflow_dispatch:
        inputs:
            dry-run:
                description: 只打包演练，不真正发布
                type: boolean
                default: true

permissions:
    contents: read
    id-token: write # Trusted Publishing（OIDC）需要它

jobs:
    publish:
        runs-on: ubuntu-24.04 # 固定镜像版本，构建环境不随 ubuntu-latest 迁移而变
        timeout-minutes: 15
        # 发版不能并发：同一时刻只让一个 run 碰 npm
        concurrency:
            group: publish-npm
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24 # 自带的 npm 是 11.x，满足 Trusted Publishing 要求的 npm ≥ 11.5.1
                  registry-url: https://registry.npmjs.org/
                  cache: npm

            - run: npm ci

            - run: npm run typecheck

            # 发布包内容取决于构建产物，而 dist/ 不在仓库里（由构建生成、已被 ignore）：
            # 先构建再核对清单。npm pack 不触发 prepublishOnly，只有 npm publish 会触发，
            # 因此不先构建时，这里看到的是一份只含 package.json / README / LICENSE 的空包。
            - name: 构建并核对发布包内容
              run: |
                  set -euo pipefail
                  npm run build
                  # npm 把清单写在 stderr，因此需要 2>&1，否则 tee 拿到的是空文件
                  npm pack --dry-run 2>&1 | tee /tmp/pack.txt
                  # 这两个文件必须进包，否则安装后得到的是一个无法运行的空包
                  grep -q "dist/main.js" /tmp/pack.txt
                  grep -q "dist/web/index.html" /tmp/pack.txt
                  grep -E "total files|package size|unpacked size" /tmp/pack.txt

            # 推标签进来的那条路也核一次：发出去的版本号必须与标签一致
            - name: 核对标签与 package.json 的版本
              if: github.event_name == 'push'
              run: |
                  set -e
                  tag="${{ github.ref_name }}"
                  version="v$(node -p "require('./package.json').version")"
                  if [ "$tag" != "$version" ]; then
                    echo "标签是 $tag，但 package.json 里是 $version。"
                    exit 1
                  fi
                  echo "版本对得上：$tag"

            - name: 该版本已经在 npm 上就跳过
              id: check
              # 推同一个标签两次时 release.yml 是可重入的（附件覆盖上传），npm 侧则不能重复发布
              # 同一个版本号，因此先查一次，已经发过就跳过，不让重复推标签变成一条失败记录
              run: |
                  set -euo pipefail
                  name="$(node -p "require('./package.json').name")"
                  version="$(node -p "require('./package.json').version")"
                  if npm view "${name}@${version}" version >/dev/null 2>&1; then
                    echo "${name}@${version} 已经发布过，跳过发布"
                    echo "skip=1" >> "$GITHUB_OUTPUT"
                  else
                    echo "${name}@${version} 还没发布过，继续"
                  fi

            - name: 演练（不发布）
              if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
              # 同样会运行 prepublishOnly（再次构建），因此这里打印的是实际的内容清单
              run: npm publish --dry-run

            - name: 发布
              # 推标签时直接发；手动触发时只有把 dry-run 关掉才发。已经发过的版本跳过
              if: ${{ (github.event_name == 'push' || !inputs.dry-run) && steps.check.outputs.skip != '1' }}
              # prepublishOnly 会自动运行 npm run build，因此这里不必再构建一次
              run: npm publish --provenance --access public
              # env:
              #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # 用 Trusted Publishing 时不需要
